<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nadiye & Yusuf Can</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f2e4e7;
}

body {
  font-family: Georgia, serif;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* SAHNELER */

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.35s ease;
}

.scene img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

/* KAPALI ZARF
   Artık ekstra buton yok.
   Ekranın tamamına dokunulabilir.
*/

#closed {
  cursor: pointer;
}

/* DAVETİYE */

#invitation {
  position: absolute;
}

/* GERİ SAYIM */

#countdown {
  position: absolute;

  /* Kartın üst bölümüne yakın */
  top: 82%;

  left: 50%;
  transform: translateX(-50%);

  background: rgba(255,255,255,0.82);
  color: #66585d;

  padding: 7px 15px;
  border-radius: 20px;

  font-size: 12px;
  letter-spacing: 0.3px;

  white-space: nowrap;

  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

/* BUTONLAR */

#details {
  position: absolute;

  /*
    Butonları kartın alt kısmına taşıyoruz.
    Gerekiyorsa sadece bu top değerini değiştireceğiz.
  */
  top: 73%

  left: 50%;
  transform: translateX(-50%);

  width: 82%;

  display: flex;
  justify-content: center;
  gap: 10px;

  pointer-events: none;
}

.buttons {
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.buttons a {
  text-decoration: none;

  color: #4b4244;

  background: rgba(255,255,255,0.94);

  padding: 9px 13px;

  border-radius: 22px;

  font-size: 12px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.10);

  white-space: nowrap;
}

.buttons a:active {
  transform: scale(0.96);
}

/* TELEFONLAR */

@media (max-width: 430px) {

  #countdown {
    top: 17%;
    font-size: 11px;
    padding: 6px 12px;
  }

  #details {
    top: 78%;
    width: 85%;
  }

  .buttons a {
    font-size: 11px;
    padding: 8px 11px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- KAPALI ZARF -->
  <div id="closed" class="scene">

    <img
      src="IMG_3727.png"
      alt="Nadiye & Yusuf Can"
    >

  </div>


  <!-- AÇILMIŞ ZARF -->
  <div id="opened" class="scene hidden">

    <img
      src="IMG_3729.png"
      alt="Açılmış zarf"
    >

  </div>


  <!-- DAVETİYE -->
  <div id="invitation" class="scene hidden">

    <img
      src="IMG_3731.png"
      alt="Nadiye & Yusuf Can davetiyesi"
    >

    <!-- GERİ SAYIM -->
    <div id="countdown"></div>


    <!-- BUTONLAR -->
    <div id="details">

      <div class="buttons">

        <a
          href="https://maps.apple/p/nSieDedtig9bE7"
          target="_blank"
        >
          📍 Konuma Git
        </a>

        <a
          href="#"
          id="calendarButton"
        >
          📅 Takvime Ekle
        </a>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   ZARFI AÇMA
========================= */

const closed = document.getElementById("closed");
const opened = document.getElementById("opened");
const invitation = document.getElementById("invitation");

closed.addEventListener("click", openInvitation);

function openInvitation() {

  /* Kapalı zarf kayboluyor */
  closed.classList.add("hidden");

  /*
    Çok kısa bekleme.
    Böylece açık zarf ekranı
    fotoğraf gibi uzun süre kalmayacak.
  */

  setTimeout(() => {

    opened.classList.remove("hidden");

    /*
      Açık zarf sadece 0.65 saniye.
      Sonra doğrudan davetiyeye geçiyor.
    */

    setTimeout(() => {

      opened.classList.add("hidden");
      invitation.classList.remove("hidden");

    }, 650);

  }, 250);

}


/* =========================
   GERİ SAYIM
========================= */

const target =
  new Date("2026-08-25T13:00:00+03:00").getTime();

function updateCountdown() {

  const now = new Date().getTime();

  const distance = target - now;

  const countdown =
    document.getElementById("countdown");

  if (distance <= 0) {

    countdown.innerHTML =
      "Bugün buluşuyoruz 🤍";

    return;
  }

  const days =
    Math.floor(
      distance / (1000 * 60 * 60 * 24)
    );

  const hours =
    Math.floor(
      (distance % (1000 * 60 * 60 * 24))
      / (1000 * 60 * 60)
    );

  const minutes =
    Math.floor(
      (distance % (1000 * 60 * 60))
      / (1000 * 60)
    );

  countdown.innerHTML =
    `${days} gün · ${hours} saat · ${minutes} dakika`;

}

updateCountdown();

setInterval(updateCountdown, 60000);


/* =========================
   TAKVİME EKLE
========================= */

document
  .getElementById("calendarButton")
  .addEventListener("click", function(e) {

    e.preventDefault();

    const start = "20260825T140000";
    const end   = "20260825T150000;

    const url =
      "https://calendar.google.com/calendar/render" +
      "?action=TEMPLATE" +
      "&text=Nadiye%20%26%20Yusuf%20Can%20Nişan" +
      "&dates=" + start + "/" + end +
      "&location=İncesu%20Marina,%20İncesu,%20Kayseri" +
      "&details=Sizi%20de%20aramızda%20görmekten%20mutluluk%20duyarız.%20🤍";

    window.open(url, "_blank");

  });

</script>

</body>
</html>
